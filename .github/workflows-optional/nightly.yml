# OPTIONAL: nightly deterministic regression run. No AI, no secrets, no cost beyond
# GitHub Actions minutes. Opens (or updates) one issue when the run fails.
# Not active until copied to .github/workflows/.
name: Nightly checks

on:
  schedule:
    - cron: "17 17 * * *" # 01:17 Asia/Manila
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for the self-test
        run: npx playwright install --with-deps chromium
      - name: Run checks
        run: ./scripts/check.sh all
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly checks failing"
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "${{ github.repository }}" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "Nightly run failed: $RUN_URL"
          fi

# OPTIONAL, COSTS MONEY: AI review of pull requests. Supplementary to CI and human review.
# Not active until copied to .github/workflows/ and the ANTHROPIC_API_KEY secret is added.
# Cost controls: skips drafts and bot PRs, one run per PR at a time, capped turns, read-only tools.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repository branches only: fork PRs get no secrets and must not reach this job.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} following
            .claude/skills/review-pr/SKILL.md. CI already covers formatting, lint, types and
            tests; do not repeat them. Post one concise review comment with findings by
            severity and a verdict. Do not approve, merge, push or edit files.
          claude_args: |
            --model sonnet
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(git diff *),Bash(git log *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh pr comment *)"
